spring:
  application:
    name: ziplink

  profiles:
    default: dev

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

app:
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}

    access-token:
      name: access_token
      path: /

    refresh-token:
      name: refresh_token
      path: /api/v1/auth

  frontend:
    url: ${FRONTEND_URL}
